name: Rapport de problème
description: Signaler un dysfonctionnement de Battery Manager
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        N'activez pas le pilotage réel pour reproduire un problème dangereux. Retirez les adresses, mots de passe, jetons MQTT et numéros de série avant de publier des journaux.
  - type: input
    id: version
    attributes:
      label: Version de Battery Manager
      placeholder: 0.2.26
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Version de Home Assistant
      placeholder: 2026.8.0
    validations:
      required: true
  - type: dropdown
    id: battery
    attributes:
      label: Type de batterie
      options:
        - Hoymiles MS-A2
        - Marstek par entités
        - Générique / surveillance seule
        - Plusieurs types
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Description du problème
      description: Décrivez le résultat attendu et le résultat observé.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration utile
      description: Indiquez les modes, limites, conventions de signe et sujets MQTT en masquant les numéros de série.
  - type: textarea
    id: logs
    attributes:
      label: Journaux Home Assistant
      render: text

